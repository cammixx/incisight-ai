<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" fill="none">
  <!-- Pump bottle (left) -->
  <rect x="8" y="38" width="38" height="52" rx="8" fill="#e8d5d8" stroke="#c0909a" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="16" y="50" width="22" height="14" rx="3" fill="#dbbfc4" stroke="#c0909a" stroke-width="2.5"/>
  <!-- Pump neck -->
  <rect x="25" y="20" width="7" height="20" rx="3" fill="#e2cdd0" stroke="#c0909a" stroke-width="3"/>
  <!-- Pump head -->
  <rect x="16" y="14" width="24" height="10" rx="4" fill="#e2cdd0" stroke="#c0909a" stroke-width="3"/>
  <!-- Pump nozzle -->
  <rect x="38" y="10" width="12" height="7" rx="3" fill="#dbbfc4" stroke="#c0909a" stroke-width="2.5"/>

  <!-- Cream jar (center-bottom) -->
  <rect x="30" y="64" width="42" height="26" rx="6" fill="#e8d5d8" stroke="#c0909a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Jar lid -->
  <rect x="28" y="57" width="46" height="12" rx="5" fill="#dbbfc4" stroke="#c0909a" stroke-width="3"/>
  <!-- Jar circle logo -->
  <circle cx="51" cy="77" r="7" fill="#d4adb3" stroke="#c0909a" stroke-width="2.5"/>
  <!-- Cream swirl on top -->
  <ellipse cx="51" cy="53" rx="17" ry="9" fill="#f2e4e6" stroke="#c0909a" stroke-width="2.5"/>
  <path d="M37 54 Q44 47 51 52 Q58 57 65 50" stroke="#c0909a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Tube (right) -->
  <rect x="78" y="28" width="32" height="62" rx="6" fill="#e8d5d8" stroke="#c0909a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Tube top band -->
  <rect x="78" y="28" width="32" height="14" rx="6" fill="#dbbfc4" stroke="#c0909a" stroke-width="3"/>
  <!-- Tube oval logo -->
  <ellipse cx="94" cy="64" rx="10" ry="6" fill="#d4adb3" stroke="#c0909a" stroke-width="2.5"/>
  <!-- Tube cap -->
  <rect x="83" y="17" width="22" height="14" rx="4" fill="#d4adb3" stroke="#c0909a" stroke-width="3"/>

  <!-- No image watermark -->
  <text x="60" y="54" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="20" font-weight="900" fill="#000000" letter-spacing="2" transform="rotate(-25, 60, 54)">NO IMAGE</text>
</svg>
